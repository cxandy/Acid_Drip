name: Build firmware

# Build both firmware variants and upload the UF2 files as artifacts.
# Triggers: push to main, any pull request, or manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arduino-cli / rp2040
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1

      # The RP2040 core is not in the default Arduino index, so add Philhower's extra index URL.
      # The package name in that index is rp2040, so the core id is rp2040:rp2040,
      # and the FQBN is rp2040:rp2040:rpipico (not arduino:rp2040).
      - name: Install RP2040 core
        run: |
          arduino-cli version
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli config dump
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040
          arduino-cli core list

      - name: Install Adafruit libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ILI9341"
          arduino-cli lib list

      # Mozzi is available from Library Manager; if that entry cannot be fetched,
      # install from the sensorium/Mozzi v2.0.4 source tree (the repo root is library.properties).
      - name: Install Mozzi
        run: |
          if arduino-cli lib install "Mozzi@2.0.4"; then
            echo "Mozzi installed from the library index"
          else
            echo "Library index install failed, falling back to the GitHub source tree"
            mkdir -p "$HOME/Arduino/libraries"
            curl -sSL -o /tmp/mozzi.zip https://github.com/sensorium/Mozzi/archive/refs/tags/v2.0.4.zip
            rm -rf /tmp/mozzi && mkdir -p /tmp/mozzi
            unzip -q /tmp/mozzi.zip -d /tmp/mozzi
            rm -rf "$HOME/Arduino/libraries/Mozzi"
            mv /tmp/mozzi/Mozzi-2.0.4 "$HOME/Arduino/libraries/Mozzi"
            ls "$HOME/Arduino/libraries/Mozzi" | head -20
          fi
          arduino-cli lib list

      # -- Variant A: factory firmware ------------------------------------------
      # The sketch folder has the same name as the main .ino, so it compiles directly.
      #
      # --build-path is required; do not use --build-property build.path=...
      # arduino-pico's core archive is written by arduino-cli into its own internal build directory,
      # so --build-property only changes the path seen by the link step; the linker then looks for
      # <build.path>/core/core.a and cannot find it (ld: cannot find .../core/core.a).
      - name: Compile variant A (factory)
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --warnings default \
            --build-path "${{ github.workspace }}/build/variant_a" \
            Firmware/Acid_Drip_Drum_Acid_Drift_V5

      # -- Variant B: AcidBox 303 -----------------------------------------------
      # The sketch folder (Acid_Drip_V5_AcidBox) and the main .ino
      # (Acid_Drip_V5_Drum_Acid_Drift) have different names, so stage it under
      # a matching folder name before compiling with arduino-cli.
      - name: Stage variant B sketch
        run: |
          mkdir -p build/sketches
          cp -r Firmware/Acid_Drip_V5_AcidBox build/sketches/Acid_Drip_V5_Drum_Acid_Drift
          ls -l build/sketches/Acid_Drip_V5_Drum_Acid_Drift

      - name: Compile variant B (AcidBox 303)
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --warnings default \
            --build-path "${{ github.workspace }}/build/variant_b" \
            build/sketches/Acid_Drip_V5_Drum_Acid_Drift

      - name: Collect UF2 binaries
        run: |
          mkdir -p dist
          cp build/variant_a/*.uf2 dist/Acid_Drip_V5.uf2
          cp build/variant_b/*.uf2 dist/Acid_Drip_V5_AcidBox_303.uf2
          ls -l dist
          sha256sum dist/*.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: acid-drip-firmware
          path: dist/*.uf2
          if-no-files-found: error
