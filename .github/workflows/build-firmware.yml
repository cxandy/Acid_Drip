name: Build firmware

# 编译两套固件并把 UF2 作为 artifact 上传。
# 触发：推送到 main / 任意 PR / 手动触发。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arduino-cli / rp2040
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1

      # RP2040 核心不在 Arduino 默认索引里，必须加 Philhower 的额外索引 URL。
      # 该索引里的包名是 rp2040，所以核心 id 是 rp2040:rp2040，
      # FQBN 也就是 rp2040:rp2040:rpipico（不是 arduino:rp2040）。
      - name: Install RP2040 core
        run: |
          arduino-cli version
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli config dump
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040
          arduino-cli core list

      - name: Install Adafruit libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ILI9341"
          arduino-cli lib list

      # Mozzi 走 Library Manager；万一索引里那个条目取不到，直接从
      # sensorium/Mozzi 的 v2.0.4 源码树装（仓库根目录就是 library.properties）。
      - name: Install Mozzi
        run: |
          if arduino-cli lib install "Mozzi@2.0.4"; then
            echo "Mozzi installed from the library index"
          else
            echo "Library index install failed, falling back to the GitHub source tree"
            mkdir -p "$HOME/Arduino/libraries"
            curl -sSL -o /tmp/mozzi.zip https://github.com/sensorium/Mozzi/archive/refs/tags/v2.0.4.zip
            rm -rf /tmp/mozzi && mkdir -p /tmp/mozzi
            unzip -q /tmp/mozzi.zip -d /tmp/mozzi
            rm -rf "$HOME/Arduino/libraries/Mozzi"
            mv /tmp/mozzi/Mozzi-2.0.4 "$HOME/Arduino/libraries/Mozzi"
            ls "$HOME/Arduino/libraries/Mozzi" | head -20
          fi
          arduino-cli lib list

      # ── 变体 A：原版声音 ──────────────────────────────────────────────
      # Sketch 文件夹名与主 .ino 同名，可直接编译。
      #
      # 必须用 --build-path，不能用 --build-property build.path=...：
      # arduino-pico 的核心归档是 arduino-cli 写进它自己的内部构建目录的，
      # 用 --build-property 只改链接步骤看到的路径，链接就会去找
      # <build.path>/core/core.a 而找不到（ld: cannot find .../core/core.a）。
      - name: Compile variant A (original sound)
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --warnings default \
            --build-path "${{ github.workspace }}/build/variant_a" \
            Firmware/Acid_Drip_Drum_Acid_Drift_V5

      # ── 变体 B：AcidBox 303 ───────────────────────────────────────────
      # 文件夹名 (Acid_Drip_V5_AcidBox) 与主 .ino 名 (Acid_Drip_V5_Drum_Acid_Drift)
      # 不一致，先复制成同名目录再编译，保证任何 arduino-cli 版本都接受。
      - name: Stage variant B sketch
        run: |
          mkdir -p build/sketches
          cp -r Firmware/Acid_Drip_V5_AcidBox build/sketches/Acid_Drip_V5_Drum_Acid_Drift
          ls -l build/sketches/Acid_Drip_V5_Drum_Acid_Drift

      - name: Compile variant B (AcidBox 303)
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --warnings default \
            --build-path "${{ github.workspace }}/build/variant_b" \
            build/sketches/Acid_Drip_V5_Drum_Acid_Drift

      - name: Collect UF2 binaries
        run: |
          mkdir -p dist
          cp build/variant_a/*.uf2 dist/Acid_Drip_V5_Original_Sound.uf2
          cp build/variant_b/*.uf2 dist/Acid_Drip_V5_AcidBox_303.uf2
          ls -l dist
          sha256sum dist/*.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: acid-drip-firmware
          path: dist/*.uf2
          if-no-files-found: error
